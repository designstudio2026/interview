<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>푸시 알림 예시</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F4F1;min-height:100vh;padding:2rem 1rem 4rem;}
.wrap{max-width:560px;margin:0 auto;}
.page{display:none;}
.page.active{display:block;}

/* 이름 입력 페이지 */
.name-card{background:#fff;border:1px solid rgba(0,0,0,0.1);border-radius:20px;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,0.07);}
.name-top{background:#1A1917;padding:2.5rem 2rem 2rem;text-align:center;}
.name-icon{font-size:32px;margin-bottom:12px;}
.name-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;}
.name-sub{font-size:13px;color:rgba(255,255,255,0.6);}
.name-body{padding:2rem;}
.name-label{font-size:13px;font-weight:500;color:#6B6A66;margin-bottom:8px;}
.name-input{width:100%;padding:13px 16px;border:1.5px solid rgba(0,0,0,0.12);border-radius:12px;background:#F5F4F1;font-size:16px;color:#1A1917;font-family:inherit;outline:none;transition:border-color 0.15s,background 0.15s;}
.name-input:focus{border-color:#1A1917;background:#fff;}
.name-input::placeholder{color:#A09E98;}
.btn-start{width:100%;margin-top:1.25rem;padding:14px;background:#1A1917;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity 0.15s;}
.btn-start:hover{opacity:0.85;}
.btn-start:disabled{opacity:0.3;cursor:default;}

/* 목록 페이지 */
.list-header{margin-bottom:1.5rem;}
.list-name-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.list-name{font-size:22px;font-weight:700;color:#1A1917;}
.list-sub{font-size:13px;color:#6B6A66;}
.back-btn{background:none;border:none;font-size:13px;color:#6B6A66;cursor:pointer;padding:4px 0;font-family:inherit;margin-bottom:1rem;display:flex;align-items:center;gap:4px;}
.back-btn:hover{color:#1A1917;}

/* 상황 섹션 */
.sit-section{margin-bottom:1.75rem;}
.sit-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.sit-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;}
.sit-A{background:#E6F1FB;color:#185FA5;}
.sit-B{background:#E1F5EE;color:#0F6E56;}
.sit-C{background:#FBEAF0;color:#993556;}
.sit-D{background:#FAEEDA;color:#854F0B;}
.sit-title{font-size:13px;font-weight:700;color:#1A1917;}

/* 상황 탭 */
.sit-tab-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px;}
.sit-tab{padding:9px 4px;border-radius:10px;border:1.5px solid rgba(0,0,0,0.1);background:#fff;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;color:#6B6A66;transition:all 0.12s;}
.sit-tab:hover{background:#F5F4F1;}
.sit-tab.on{border-color:#1A1917;background:#1A1917;color:#fff;}

/* 세부 탭 */
.sub-tab-row{display:flex;gap:6px;margin-bottom:10px;}
.sub-tab{padding:7px 12px;border-radius:99px;border:1.5px solid rgba(0,0,0,0.1);background:#fff;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;color:#6B6A66;transition:all 0.12s;white-space:nowrap;}
.sub-tab:hover{background:#F5F4F1;}
.sub-tab.on{border-color:#534AB7;background:#534AB7;color:#fff;}

/* 개인화 탭 */
.personal-tab-row{display:flex;gap:6px;margin-bottom:1.25rem;background:#F5F4F1;border-radius:12px;padding:4px;}
.personal-tab{flex:1;padding:8px;border-radius:8px;border:none;background:none;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;color:#6B6A66;transition:all 0.12s;}
.personal-tab.on{background:#fff;color:#1A1917;box-shadow:0 1px 4px rgba(0,0,0,0.1);}

/* 다중선택 */
.multi-bar{display:flex;align-items:center;justify-content:space-between;background:#EEEDFE;border-radius:12px;padding:10px 14px;margin-bottom:12px;}
.multi-bar-txt{font-size:13px;color:#534AB7;font-weight:600;}
.btn-demo{padding:8px 18px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity 0.15s;}
.btn-demo:disabled{opacity:0.35;cursor:default;}
.btn-demo:not(:disabled):hover{opacity:0.85;}
.notif-btn{position:relative;}
.notif-btn .check-mark{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,0.15);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all 0.12s;}
.notif-btn.checked{border-color:#534AB7;background:#EEEDFE;}
.notif-btn.checked .check-mark{background:#534AB7;border-color:#534AB7;color:#fff;}

/* 말투 그룹 */
.tone-group{margin-bottom:14px;}
.tone-label{font-size:11px;font-weight:700;color:#A09E98;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;padding-left:2px;}

/* 알림 카드 버튼 */
.notif-btn{width:100%;background:rgba(245,244,241,0.95);border:1.5px solid rgba(0,0,0,0.1);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:border-color 0.15s,background 0.15s;margin-bottom:6px;text-align:left;font-family:inherit;}
.notif-btn:hover{border-color:rgba(0,0,0,0.25);background:#EBEBEB;}
.notif-icon{width:36px;height:36px;border-radius:8px;background:#E53170;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.notif-content{flex:1;min-width:0;}
.notif-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.notif-title-text{font-size:13px;font-weight:700;color:#1A1917;line-height:1.3;}
.notif-time{font-size:11px;color:#A09E98;flex-shrink:0;margin-left:6px;}
.notif-body-text{font-size:12px;color:#3A3937;line-height:1.45;}
.notif-unsub{font-size:12px;color:#1A1917;margin-top:3px;}

/* 시연 페이지 */
.demo-bg{min-height:100vh;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);border-radius:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:3rem 1.5rem 2rem;}
.demo-time{font-size:48px;font-weight:200;color:#fff;letter-spacing:-1px;text-align:center;margin-bottom:4px;}
.demo-date{font-size:14px;color:rgba(255,255,255,0.6);text-align:center;margin-bottom:2.5rem;}
.demo-hint{font-size:12px;color:rgba(255,255,255,0.35);text-align:center;position:absolute;bottom:1.5rem;}
.demo-back{position:absolute;top:1rem;left:1rem;background:rgba(255,255,255,0.15);border:none;border-radius:99px;color:#fff;font-size:12px;font-family:inherit;padding:6px 14px;cursor:pointer;z-index:20;}
.demo-back:hover{background:rgba(255,255,255,0.25);}

/* 푸시 알림 팝업 */
.push-popup{
  position:absolute;top:-120px;left:1rem;right:1rem;
  background:rgba(245,244,241,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:16px;padding:12px 14px;
  display:flex;gap:10px;align-items:center;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
  transition:top 0.5s cubic-bezier(0.34,1.56,0.64,1);
  z-index:10;
}
.push-popup.show{top:1rem;}
.push-popup .notif-icon{width:36px;height:36px;border-radius:8px;background:#E53170;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.push-popup .notif-content{flex:1;min-width:0;}
.push-popup .notif-header{display:flex;justify-content:space-between;margin-bottom:2px;}
.push-popup .notif-title-text{font-size:13px;font-weight:700;color:#1A1917;line-height:1.3;}
.push-popup .notif-time{font-size:11px;color:#A09E98;}
.push-popup .notif-body-text{font-size:12px;color:#3A3937;line-height:1.45;}
.push-popup .notif-unsub{font-size:12px;color:#1A1917;margin-top:3px;}

.countdown{font-size:13px;color:rgba(255,255,255,0.5);text-align:center;margin-top:1rem;}
</style>
</head>
<body>
<div class="wrap">

<!-- 이름 입력 페이지 -->
<div class="page active" id="page-name">
  <div class="name-card">
    <div class="name-top">
      <div class="name-icon">🛍️</div>
      <div class="name-title">푸시 알림 예시</div>
      <div class="name-sub">인터뷰 참가자 이름을 입력해주세요</div>
    </div>
    <div class="name-body">
      <div class="name-label">참가자 이름</div>
      <input class="name-input" id="name-input" type="text" placeholder="홍길동" maxlength="10"
        oninput="onNameInput()" onkeydown="if(event.key==='Enter')startDemo()"/>
      <button class="btn-start" id="btn-start" onclick="startDemo()" disabled>시작하기 →</button>
    </div>
  </div>
</div>

<!-- 목록 페이지 -->
<div class="page" id="page-list">
  <button class="back-btn" onclick="goBack()">← 이름 변경</button>
  <div class="list-header">
    <div class="list-name" id="list-name-display"></div>
    <div class="list-sub">알림을 클릭하면 시연 화면으로 이동해요</div>
  </div>

  <!-- 상황 탭 (1줄) -->
  <div class="sit-tab-row" id="sit-tab-row">
    <button class="sit-tab on" data-sit="A" onclick="selectSit('A',this)">A 세일</button>
    <button class="sit-tab" data-sit="B" onclick="selectSit('B',this)">B 배송+리뷰</button>
    <button class="sit-tab" data-sit="C" onclick="selectSit('C',this)">C 출석체크</button>
    <button class="sit-tab" data-sit="D" onclick="selectSit('D',this)">D 상품추천</button>
  </div>

  <!-- 세부 탭 (2줄) -->
  <div class="sub-tab-row" id="sub-tab-row">
    <button class="sub-tab" data-sit="E" onclick="selectSit('E',this)">😊 이모지</button>
    <button class="sub-tab" data-sit="F" onclick="selectSit('F',this)">😄 유머 세부</button>
    <button class="sub-tab" data-sit="G" onclick="selectSit('G',this)">⚡ 희소성 세부</button>
  </div>

  <!-- 개인화 탭 -->
  <div class="personal-tab-row" id="personal-tab-row">
    <button class="personal-tab on" data-personal="true" onclick="selectPersonal(true,this)">이름 호명</button>
    <button class="personal-tab" data-personal="false" onclick="selectPersonal(false,this)">미적용</button>
  </div>

  <!-- 다중선택 바 -->
  <div class="multi-bar">
    <span class="multi-bar-txt" id="multi-count">0개 선택됨</span>
    <button class="btn-demo" id="btn-demo" onclick="startMultiDemo()" disabled>시연하기</button>
  </div>

  <div id="notif-list"></div>
</div>

<!-- 시연 페이지 -->
<div class="page" id="page-demo">
  <div class="demo-bg" id="demo-bg">
    <button class="demo-back" onclick="backToList()">← 목록</button>
    <div class="demo-time" id="demo-time"></div>
    <div class="demo-date" id="demo-date"></div>
    <div class="countdown" id="countdown"></div>
    <!-- 다중 팝업 컨테이너 -->
    <div id="popup-container" style="position:absolute;top:1rem;left:1rem;right:1rem;display:flex;flex-direction:column;gap:8px;z-index:10;"></div>
    <div class="demo-hint">화면을 탭하면 알림이 사라져요</div>
  </div>
</div>

</div>

<script>
// ── 받침 유무 판별 ──────────────────────────────────────────
function hasBatchim(str) {
  if (!str) return false;
  const code = str.charCodeAt(str.length - 1);
  if (code < 0xAC00 || code > 0xD7A3) return false;
  return (code - 0xAC00) % 28 !== 0;
}
function firstName(fullName) {
  if (!fullName) return fullName;
  return fullName.length >= 2 ? fullName.slice(1) : fullName;
}
function josa(name, type) {
  const fn = firstName(name);
  const b = hasBatchim(fn);
  const map = { '은는':b?'은':'는','이가':b?'이':'가','을를':b?'을':'를','와과':b?'과':'와','아야':b?'아':'야','으로로':b?'으로':'로' };
  return map[type] || '';
}
function nim(name) { return firstName(name) + '님'; }

// ── 이모지 탭 고정 데이터 ──────────────────────────────────
const EMOJI_NOTIFS = [

  { id:'E1', sit:'E', tone:'이모지 일부', personal:false, title:'HOT한 [슈가파우더] 직잭 입점!', body:'(광고) 입점 기념 30% 쿠폰을 드려요 🎫' },
  { id:'E2', sit:'E', tone:'이모지 풀',   personal:false, title:'HOT한 [슈가파우더] 직잭 입점! 💖', body:'(광고) 입점 기념 30% 쿠폰을 드려요 🎫' },
];
const HUMOR_NOTIFS = [
  { id:'F0', sit:'F', tone:'인격화',   personal:false, title:'안녕하세요, 에이블리 신입이에요🙂', body:'(광고) 제가 52% 할인 이벤트를 처음 준비했는데 빨리 들어오…' },
  { id:'F1', sit:'F', tone:'밈',       personal:false, title:'나 됐어요 피자 당첨 됐어요!!!', body:'(광고) 이번주 마감 🍕🥤💰받기 ❯' },
  { id:'F2', sit:'F', tone:'어그로성', personal:false, title:'초성 힌트: ㅁㄱㅅㅇ에서 ㅌㅅㄹ 준대요!', body:'(광고) 정답 확인 >' },
];
const SCARCITY_NOTIFS = [
  { id:'G0', sit:'G', tone:'혜택 강조 / 기간 명시',   personal:false, title:'[게릴라 이벤트] 스벅 기프티콘 오픈!', body:'(광고) 오늘 하루만 참여할 수 있는 이벤트예요💚' },
  { id:'G1', sit:'G', tone:'손실 강조 / 기간 명시X', personal:false, title:'디저트 팝업 곧 종료, 놓치면 후회해요!!', body:'(광고) 과일샌드•쫀득빵… [무료 디저트]까지🍰' },
  { id:'G2', sit:'G', tone:'손실 강조 / 기간 명시',   personal:false, title:'🚨쇼핑몰 전 상품 쿠폰 오늘 마감!', body:'(광고) 금방 벚꽃 엔딩되니까… 서두르세요!' },
];

// ── 알림 데이터 ─────────────────────────────────────────────
function buildNotifs(name) {
  const fn = firstName(name);
  return [
    { id:'A0', sit:'A', tone:'희소성·긴박함', personal:true,  title:'오늘 자정까지만!!', body:`(광고) ${nim(name)}을 위한 전 상품 30% 할인, 지금 안 담으면 내일 후회해요!` },
    { id:'A1', sit:'A', tone:'희소성·긴박함', personal:false, title:'오늘 자정까지만!!', body:'(광고) 회원님을 위한 전 상품 30% 할인, 지금 안 담으면 내일 후회해요!' },
    { id:'A2', sit:'A', tone:'유머·친근함',   personal:true,  title:'실화인가요??', body:`(광고) 오늘 자정까지 무려 전 상품 30% 쿠폰이라니… ${nim(name)}${josa(name,'이가')} 지갑 열 준비 되셨죠?` },
    { id:'A3', sit:'A', tone:'유머·친근함',   personal:false, title:'실화인가요??', body:'(광고) 오늘 자정까지 무려 전 상품 30% 쿠폰이라니… 지갑 열 준비 되셨죠?' },
    { id:'A4', sit:'A', tone:'직접·정보전달', personal:true,  title:'S/S 할인 이벤트', body:`(광고) ${nim(name)}, 오늘 자정까지 전 카테고리 30% 할인이 적용돼요. 확인해보세요!` },
    { id:'A5', sit:'A', tone:'직접·정보전달', personal:false, title:'S/S 할인 이벤트', body:'(광고) 오늘 자정까지 전 카테고리 30% 할인이 적용돼요. 확인해보세요!' },
    { id:'B0', sit:'B', tone:'희소성·긴박함', personal:true,  title:`${nim(name)}, 단 하루 남았어요!!`, body:'(광고) 상품은 잘 받으셨나요? 오늘 리뷰를 쓰지 않으면 2,000 포인트가 사라져요.' },
    { id:'B1', sit:'B', tone:'희소성·긴박함', personal:false, title:'단 하루 남았어요!!', body:'(광고) 상품은 잘 받으셨나요? 오늘 리뷰를 쓰지 않으면 2,000 포인트가 사라져요.' },
    { id:'B2', sit:'B', tone:'유머·친근함',   personal:true,  title:`${nim(name)}… 상품 잘 도착했나요?`, body:'(광고)이긴 하지만 리뷰 하나면 저희가 정말 뿌듯할 것 같아요. 포인트 2,000점도 드릴게요.' },
    { id:'B3', sit:'B', tone:'유머·친근함',   personal:false, title:'똑똑… 상품 잘 도착했나요?', body:'(광고)이긴 하지만 리뷰 하나면 저희가 정말 뿌듯할 것 같아요. 포인트 2,000점도 드릴게요.' },
    { id:'B4', sit:'B', tone:'직접·정보전달', personal:true,  title:`${nim(name)}, 상품은 잘 받으셨나요?`, body:'(광고) 구매하신 상품의 리뷰를 남겨주시면 포인트 2,000점을 드려요!' },
    { id:'B5', sit:'B', tone:'직접·정보전달', personal:false, title:'회원님, 상품은 잘 받으셨나요?', body:'(광고) 구매하신 상품의 리뷰를 남겨주시면 포인트 2,000점을 드려요!' },
    { id:'C0', sit:'C', tone:'희소성·긴박함', personal:true,  title:`${nim(name)}, 곧 출석체크 마감이에요!!`, body:'(광고) 지금 접속해야 포인트 100점을 받아요. 자정이 지나면 사라져요!' },
    { id:'C1', sit:'C', tone:'희소성·긴박함', personal:false, title:'회원님, 곧 출석체크 마감이에요!!', body:'(광고) 지금 접속해야 포인트 100점을 받아요. 자정이 지나면 사라져요!' },

// ── 상태 ──────────────────────────────────────────────────
let userName = '';
let currentSit = 'A';
let currentPersonal = true;
let selectedItems = []; // 다중선택
let demoTimers = [];

// ── 이름 입력 ──────────────────────────────────────────────
function onNameInput() {
  const val = document.getElementById('name-input').value.trim();
  document.getElementById('btn-start').disabled = val.length === 0;
}
function startDemo() {
  const val = document.getElementById('name-input').value.trim();
  if (!val) return;
  userName = val;
  currentSit = 'A';
  currentPersonal = true;
  selectedItems = [];
  renderList();
  showPage('page-list');
}
function goBack() { showPage('page-name'); }
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ── 목록 렌더 ─────────────────────────────────────────────
function renderList() {
  document.getElementById('list-name-display').textContent = firstName(userName) + '님';
  renderNotifList();
}

function selectSit(sit, btn) {
  currentSit = sit;
  // 모든 탭 on 해제
  document.querySelectorAll('.sit-tab, .sub-tab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  // 개인화 탭: A~D만 표시
  const ptRow = document.getElementById('personal-tab-row');
  ptRow.style.display = ['A','B','C','D'].includes(sit) ? 'flex' : 'none';
  updateMultiBar();
  renderNotifList();
}

function selectPersonal(isPersonal, btn) {
  currentPersonal = isPersonal;
  document.querySelectorAll('.personal-tab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  updateMultiBar();
  renderNotifList();
}

function toggleSelect(item, btn) {
  const idx = selectedItems.findIndex(i => i.id === item.id);
  if (idx > -1) {
    selectedItems.splice(idx, 1);
    btn.classList.remove('checked');
    btn.querySelector('.check-mark').textContent = '';
  } else {
    selectedItems.push(item);
    btn.classList.add('checked');
    btn.querySelector('.check-mark').textContent = '✓';
  }
  updateMultiBar();
}

function updateMultiBar() {
  const cnt = selectedItems.length;
  document.getElementById('multi-count').textContent = `${cnt}개 선택됨`;
  document.getElementById('btn-demo').disabled = cnt === 0;
}

function renderNotifList() {
  let allNotifs, tones;
  if (currentSit === 'E') {
    allNotifs = EMOJI_NOTIFS;
    tones = ['이모지 없음','이모지 일부','이모지 풀'];
  } else if (currentSit === 'F') {
    allNotifs = HUMOR_NOTIFS;
    tones = ['인격화','밈','어그로성'];
  } else if (currentSit === 'G') {
    allNotifs = SCARCITY_NOTIFS;
    tones = ['혜택 강조 / 기간 명시','손실 강조 / 기간 명시X','손실 강조 / 기간 명시'];
  } else {
    allNotifs = buildNotifs(userName).filter(n => n.sit === currentSit && n.personal === currentPersonal);
    tones = ['희소성·긴박함','유머·친근함','직접·정보전달'];
  }
  const container = document.getElementById('notif-list');
  container.innerHTML = '';

  tones.forEach(tone => {
    const item = allNotifs.find(n => n.tone === tone);
    if (!item) return;
    const isChecked = selectedItems.some(i => i.id === item.id);

    const tg = document.createElement('div'); tg.className = 'tone-group';
    const tl = document.createElement('div'); tl.className = 'tone-label'; tl.textContent = tone; tg.appendChild(tl);

    const btn = document.createElement('button');
    btn.className = 'notif-btn' + (isChecked ? ' checked' : '');
    btn.innerHTML = `
      <div class="notif-icon">🛍️</div>
      <div class="notif-content">
        <div class="notif-header">
          <div class="notif-title-text">${item.title}</div>
          <div class="notif-time">방금 전</div>
        </div>
        <div class="notif-body-text">${item.body}</div>
        <div class="notif-unsub">수신거부: MY &gt; 설정</div>
      </div>
      <div class="check-mark">${isChecked ? '✓' : ''}</div>`;
    btn.onclick = () => toggleSelect(item, btn);
    tg.appendChild(btn);
    container.appendChild(tg);
  });
}

// ── 시연 페이지 ───────────────────────────────────────────
function startMultiDemo() {
  if (!selectedItems.length) return;
  demoTimers.forEach(t => { clearTimeout(t); clearInterval(t); });
  demoTimers = [];

  const now = new Date();
  const h = now.getHours().toString().padStart(2,'0');
  const m = now.getMinutes().toString().padStart(2,'0');
  document.getElementById('demo-time').textContent = h+':'+m;
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('demo-date').textContent = (now.getMonth()+1)+'월 '+now.getDate()+'일 '+days[now.getDay()]+'요일';

  const container = document.getElementById('popup-container');
  container.innerHTML = '';

  const popups = selectedItems.map(item => {
    const popup = document.createElement('div');
    popup.className = 'push-popup';
    popup.style.cssText = 'position:relative;top:auto;left:auto;right:auto;opacity:0;transform:translateY(-20px);transition:opacity 0.4s ease,transform 0.4s cubic-bezier(0.34,1.56,0.64,1);cursor:pointer;';
    popup.innerHTML =
      '<div class="notif-icon">🛍️</div>' +
      '<div class="notif-content">' +
        '<div class="notif-header">' +
          '<div class="notif-title-text">'+item.title+'</div>' +
          '<div class="notif-time">방금 전</div>' +
        '</div>' +
        '<div class="notif-body-text">'+item.body+'</div>' +
        '<div class="notif-unsub">수신거부: MY &gt; 설정</div>' +
      '</div>';
    popup.addEventListener('click', function() {
      popup.style.opacity = '0';
      popup.style.transform = 'translateY(-20px)';
    });
    container.appendChild(popup);
    return popup;
  });

  showPage('page-demo');

  const delay = Math.floor(Math.random() * 2000) + 3000;
  let remaining = Math.ceil(delay / 1000);
  const countEl = document.getElementById('countdown');
  countEl.textContent = remaining+'초 후 알림이 도착해요';
  const cTimer = setInterval(function() {
    remaining--;
    if (remaining > 0) countEl.textContent = remaining+'초 후 알림이 도착해요';
    else { countEl.textContent = ''; clearInterval(cTimer); }
  }, 1000);
  demoTimers.push(cTimer);

  const t = setTimeout(function() {
    popups.forEach(function(popup, i) {
      const t2 = setTimeout(function() {
        popup.style.opacity = '1';
        popup.style.transform = 'translateY(0)';
      }, i * 500);
      demoTimers.push(t2);
    });
  }, delay);
  demoTimers.push(t);
}

function backToList() {
  demoTimers.forEach(function(t) { clearTimeout(t); clearInterval(t); });
  demoTimers = [];
  document.getElementById('countdown').textContent = '';
  document.getElementById('popup-container').innerHTML = '';
  showPage('page-list');
  window.scrollTo(0, 0);
}
